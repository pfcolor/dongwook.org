<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다 (저장값 > 시스템 설정) */
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  {% seo %}
  {%- if jekyll.environment == "production" and site.google_analytics != "" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "{{ site.google_analytics }}");
  </script>
  {%- endif %}
  <script>
    /* Google Analytics 이벤트. gtag가 없으면(로컬 미리보기, 차단 등) 조용히 넘어간다 */
    function track(name, params) {
      if (typeof gtag === "function") gtag("event", name, params || {});
    }
  </script>
  {% feed_meta %}
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <span class="site-title mono">{{ site.title }}</span>
    <nav class="mono">
      {%- for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == "/" and page.collection == "posts" %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 전환"></button>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer mono">
    <span>&copy; {{ site.title }}</span>
    <a href="{{ '/atom.xml' | relative_url }}">rss</a>
  </footer>

  <script>
    /* 직접 고른 적이 없으면 폰/OS의 라이트·다크 설정 변화를 그대로 따라간다 */
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
      var saved;
      try { saved = localStorage.getItem("theme"); } catch (err) {}
      if (!saved) document.documentElement.dataset.theme = e.matches ? "dark" : "light";
    });

    /* data-track="이벤트명"이 붙은 요소를 누르면(가운데 버튼 포함) 이벤트를 보낸다. 나머지 data-*는 파라미터 */
    function trackClick(e) {
      if (e.type === "auxclick" && e.button !== 1) return;
      var el = e.target.closest("[data-track]");
      if (!el) return;
      var params = {};
      for (var key in el.dataset) if (key !== "track") params[key] = el.dataset[key];
      track(el.dataset.track, params);
    }
    document.addEventListener("click", trackClick);
    document.addEventListener("auxclick", trackClick);

    /* quotes에서 인용을 펼칠 때 출처 제목을 보낸다 (toggle은 버블링하지 않아 캡처로 받는다) */
    document.addEventListener("toggle", function (e) {
      var d = e.target;
      if (d.tagName !== "DETAILS" || !d.open) return;
      var summary = d.querySelector("summary");
      if (!summary) return;
      var clone = summary.cloneNode(true);
      clone.querySelectorAll(".date, .by").forEach(function (n) { n.remove(); });
      track("quote_open", { item: clone.textContent.trim() });
    }, true);

    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
