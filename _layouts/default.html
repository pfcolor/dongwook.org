<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다 (저장값 > 시스템 설정) */
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {%- for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == "/" and page.collection == "posts" %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="라이트/다크 전환"></button>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
    <a href="{{ '/atom.xml' | relative_url }}">rss</a>
  </footer>

  <script>
    /* 직접 고른 적이 없으면 폰/OS의 라이트·다크 설정 변화를 그대로 따라간다 */
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
      var saved;
      try { saved = localStorage.getItem("theme"); } catch (err) {}
      if (!saved) document.documentElement.dataset.theme = e.matches ? "dark" : "light";
    });

    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
