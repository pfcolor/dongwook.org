title: dongwook
description: odds and ends. written down.
twitter:
  card: summary_large_image
url: "https://dongwook.org"
baseurl: ""
lang: ko
author:
  name: dongwook
timezone: Asia/Seoul

# Google Search Console 소유권 확인 토큰(HTML 태그 방식의 content 값).
# 값을 받으면 아래 두 줄의 주석을 풀고 채운다. 비워 둔 채 켜면 빈 meta가 출력된다.
# webmaster_verifications:
#   google: ""

# Google Analytics 측정 ID(G-XXXXXXXXXX). 비워 두면 출력하지 않는다(production 빌드에서만 켜짐).
google_analytics: "G-ZM7YWXMLYR"

# 댓글 API 주소(comments-worker). 비워 두면 댓글창을 출력하지 않는다.
comments_api: "https://dongwook-comments.dongwook.workers.dev"
# Cloudflare Turnstile 사이트 키(선택). 비워 두면 확인 위젯 없이 동작한다.
turnstile_sitekey: "0x4AAAAAAFXdsm7AchQ70zVJ"

# quotes 한 쪽에 보여 줄 인용 수(_plugins/quotes-pagination.rb). 넘으면 /quotes/page/N/으로 나뉜다.
quotes_per_page: 30

# photos 한 쪽에 보여 줄 사진 수(_plugins/photos-pagination.rb). 마지막 쪽에 photos_orphan_max장 이하만 남으면 앞 쪽에 합친다.
photos_per_page: 30
photos_orphan_max: 3

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_backlink: "&#8617;&#xFE0E;"

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: atom.xml

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og.png
        width: 1200
        height: 630
        alt: "dongwook — odds and ends. written down."
  - scope:
      path: "naverf71e13f8fcbc7a0f3a308e2beee64862.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - comments-worker
