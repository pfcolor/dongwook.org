title: dongwook
description: odds and ends. written down.
twitter:
  card: summary_large_image
url: "https://dongwook.org"
baseurl: ""
lang: ko
timezone: Asia/Seoul

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: atom.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
